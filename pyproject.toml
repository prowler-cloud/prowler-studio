[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-fixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[openai]>=1.15.0",
    "strands-agents-tools>=0.2.0",
    "pydantic>=2.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
autonomous-fixer = "src.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
