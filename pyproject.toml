[project]
name = "prowler-studio"
version = "0.1.0"
description = "Prowler Studio is a framework for automating Prowler security check development using Claude Code agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.20.0",
    "gitpython>=3.1.0",
    "jinja2>=3.1.0",
    "claude-agent-sdk>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "interrogate>=1.7.0",
]

[project.scripts]
prowler-studio = "core.main:app"


[tool.uv]
package = true

# Ruff configuration - Modern Python linter and formatter
[tool.ruff]
line-length = 88
target-version = "py312"

# Enable pycodestyle (E, W), Pyflakes (F), isort (I), and more
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]

lint.ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "working",
]

# Allow autofix for all enabled rules
lint.fixable = ["ALL"]
lint.unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# mypy configuration - Static type checking
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

# Ignore missing imports for third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "git.*",
    "typer.*",
    "jinja2.*",
]
ignore_missing_imports = true

# Bandit configuration - Security linting
[tool.bandit]
exclude_dirs = [".venv", "tests", "working"]
skips = ["B101"]  # Skip assert_used (commonly used in tests)

# Interrogate configuration - Docstring coverage
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = [".venv", "tests", "working"]
verbose = 1
quiet = false
color = true
